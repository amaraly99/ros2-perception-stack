# ours_fx554_A_ibvs_mono_accurate.yaml -- Ahmed's Level 2 cell S1 (exp/detector-accuracy), prompt 20C.
# Placement A: YOLO on the NPU, producer on core 1; OV2SLAM on cores 2,3; controller ibvs.
# ONE line differs from ours_fx554_A_ibvs.yaml: the SLAM calibration path. The detector sweep
# co-loaded camera_calib/hil_sim_ov2slam.yaml, which is the ACCURATE extractor profile but at
# fx = fy = 1200 with debug: 1 (VERIFIED :67,68,108), while hil_sim_ov2slam_accurate.yaml is the
# same profile at fx = fy = 554 with debug: 0 (VERIFIED :33,34,74). The sweep's co-load was a
# mis-calibrated mono OV2SLAM, harmless there because the pose is unused, and wrong for a SLAM row.
# use_slam_pose / use_slam_depth stay off: on a SLAM row the arm is measured, never flown on.
# Shared Simulink model from 2026-10-04 (sha256 b8ec8250...): the camera renders at fx = fy = 554,
# start (5.13, 4.30, 10, 2*pi-0.0460). cam_fx 554 is set explicitly (same as bench_fsm.yaml) so the
# run record shows it. Same as ours_fx1200_A_ibvs.yaml in every other line.
# Bags (mode: record) carry /sim/drone_pose, /sim/target_pose and /yolo/detections for the
# in-loop scorer, plus /bench/state for the mission metrics.
mode: record

network:
  matlab_host_ip: 192.168.56.1
  interface:      eth0
  dds:            fastrtps
  ros_domain_id:  0

camera:
  stamp_log: /tmp/sim_cam_stamps.csv

detector:
  type:     yolo
  cpu:      "0-3"         # yolo_bridge: taskset -c 0-3 = all four Pi 5 cores, the same allowed set as
                          # unpinned and the same prefix the detector sweep used (node_cores 0-3)
  host_cpu: "1"
  yolo:
    model:         yolo26n            # models/model_registry.json id (run_stack_hil.sh --model overrides)
    backend:       npu
    models_dir:    /home/ahmed/ROS2-PROJECT-SPRING2026/models
    confidence:    0.20
    telemetry_csv: /tmp/yolo_telemetry.csv

controller:
  type: ibvs
  cpu:  "0-3"             # all four cores, equivalent to unpinned (an empty value is rejected by ros2 launch)
  cam_fx: 554.0
  use_slam_depth: false
  use_slam_pose:  false

slam:
  enabled:           true
  type:              ov2slam
  image:             ros2_perception_stack
  container_name:    slam_ov2slam
  cpu:               "2,3"
  startup_delay_sec: 5
  restart:           unless-stopped
  command:           "ros2 run ov2slam ov2slam_node /workspace/camera_calib/hil_sim_ov2slam_accurate.yaml"
  topics:
    image_in: /ovcam/image_raw
    pose_out: /slam/pose
  remap:
    - "/ovcam/image_raw:=/ovcam/image_raw"
    - "vo_pose:=/slam/pose"
    - "slam_tracking_state:=/slam/tracking_state"

init_gate:
  enabled: false
